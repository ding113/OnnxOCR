services:
  onnxocr-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onnxocr-service
    ports:
      - "5005:5005"
    restart: unless-stopped
    volumes:
      - ./models:/app/onnxocr/models   # 模型文件持久化目录
      - ./cache_data:/cache_data       # 缓存数据持久化目录
      - ./results:/app/results         # OCR结果输出目录
    environment:
      - CACHE_ENABLED=true
      - CACHE_DIR=/cache_data
      - CACHE_SIZE_LIMIT_GB=10
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    tmpfs:
      - /tmp                   # 临时文件使用内存文件系统，提高性能